name: Feature request
description: Suggest a table workflow or compatibility improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and where does the current workflow stop you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction, expected Markdown result, and export behavior if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Typora version, operating system, plugin version
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request preserves native Markdown table editing rather than converting the table to an HTML block.
          required: true
