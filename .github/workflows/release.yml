name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run typecheck

      - run: pnpm run pack

      - name: Build macOS native bridge
        run: |
          ./native/macos/build.sh
          ./native/macos/build-launcher.sh
          ./native/macos/pack.sh "${{ github.ref_name }}"

      - name: Generate release body
        run: |
          tag="${{ github.ref_name }}"
          {
            echo "## Typora TableCraft $tag"
            echo
            awk -v version="$tag" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Downloads"
            echo
            echo "- **plugin.zip** — community web plugin (all declared platforms)"
            echo "- **typora-tablecraft-macos-native-$tag.zip** — experimental native macOS Table-menu bridge"
            echo
            echo "Read the installation, backup, and compatibility notes in the repository README before installing the native bridge."
          } > release_body.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "Typora TableCraft ${{ github.ref_name }}"
          --notes-file release_body.md
          --verify-tag
          plugin.zip
          "typora-tablecraft-macos-native-${{ github.ref_name }}.zip"
